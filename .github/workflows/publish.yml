name: Publish

# Tag-driven release, run from a clean checkout so the tarballs always match the
# tag (the 0.6.0/0.6.1 tarballs were packed from a working copy — see #20).
#
# Two jobs on purpose: `verify` installs, tests, builds and produces the exact
# tarballs that `publish` uploads — with no npm token and no OIDC credentials
# available while third-party code (bun install, the test suite) runs.
#
# Nothing is published unless all of these hold:
#   * the ref is a tag and `v<package.json version>` matches it;
#   * root's exact pin on `@omp-deck/protocol` equals the protocol's own version;
#   * a name that already exists on the registry is owned by the token's user —
#     an existing but foreign name fails the run instead of being treated as
#     "already published" (#19 is exactly that scenario);
#   * the packed listing matches what git tracks, so untracked debris cannot
#     ride along (#20).
#
# Re-running a tag is safe: versions already on the registry *and owned by us*
# are skipped. It does NOT repair the versions published under the old scheme —
# `workflow_dispatch` only runs a workflow that exists on the selected ref, and
# the release tags predate this file, so those need a one-off `npm publish` from
# a checkout of each tag. From the next release on, `@omp-deck/protocol` is
# published alongside `omp-deck`, which is what #16 needs (installs that do not
# resolve `bundledDependencies` — bun — cannot proceed without that name on the
# registry). Dispatch runs are dry by default and can only publish when
# dispatched on a tag ref.
#
# Required repository secret: NPM_TOKEN — an npm automation token for a user
# that owns the `@omp-deck` scope and the `omp-deck` package. Provenance needs a
# public repo and npm >= 9.5; it is requested on the real publishes only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate everything without publishing"
        type: boolean
        default: true

permissions:
  contents: read

# Releases serialize; two tag pushes must not interleave (omp-deck could land
# before its matching protocol version exists).
concurrency:
  group: npm-publish
  cancel-in-progress: false

env:
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: install (frozen)
        run: bun install --frozen-lockfile

      - name: typecheck
        run: bun run typecheck

      - name: test
        run: bun test

      - name: release identity gate
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          PROTO_VERSION=$(node -p "require('./packages/protocol/package.json').version")
          PIN=$(node -p "require('./package.json').dependencies['@omp-deck/protocol']")
          echo "omp-deck ${VERSION} · protocol ${PROTO_VERSION} · pin ${PIN}"
          echo "ref ${GITHUB_REF_TYPE:-none}/${GITHUB_REF_NAME:-none} · dry-run ${DRY_RUN}"
          [ "${PIN}" = "${PROTO_VERSION}" ] || {
            echo "::error::package.json pins @omp-deck/protocol ${PIN} but packages/protocol declares ${PROTO_VERSION}";
            exit 1;
          }
          if [ "${DRY_RUN}" != "true" ]; then
            [ "${GITHUB_REF_TYPE}" = "tag" ] || {
              echo "::error::publishing requires a tag ref (got ${GITHUB_REF_TYPE:-none})";
              exit 1;
            }
            [ "v${VERSION}" = "${GITHUB_REF_NAME}" ] || {
              echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version v${VERSION}";
              exit 1;
            }
          fi

      # The runner starts clean, but be explicit: prepack skips the vite build
      # whenever apps/web/dist/index.html already exists, which is how a stale
      # dist could ship (the web half of the #20 class).
      - name: build web (clean)
        run: |
          set -euo pipefail
          rm -rf apps/web/dist
          bun --cwd apps/web run build

      # Tarball names are derived, not parsed: scoped packages pack as
      # `<name-without-scope>-<version>.tgz`, and `npm pack --json` cannot be
      # piped to a file here because the prepack lifecycle prints to stdout.
      - name: pack + verify @omp-deck/protocol
        working-directory: packages/protocol
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TARBALL="omp-deck-protocol-${VERSION}.tgz"
          rm -f ./*.tgz ./listing.txt
          npm pack
          [ -f "${TARBALL}" ] || {
            echo "::error::expected ${TARBALL} was not produced";
            ls -l
            exit 1;
          }
          echo "packed: ${TARBALL}"
          tar -tzf "${TARBALL}" > listing.txt
          if grep -q '\.test\.ts$' listing.txt; then
            echo "::error::test files must not be published:"
            grep '\.test\.ts$' listing.txt || true
            exit 1
          fi
          for required in package/package.json package/src/index.ts package/src/validate.ts; do
            grep -qx "${required}" listing.txt || {
              echo "::error::${required} missing from the protocol tarball";
              exit 1;
            }
          done
          rm -f ./listing.txt

      - name: pack + verify omp-deck
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TARBALL="omp-deck-${VERSION}.tgz"
          rm -f omp-deck-*.tgz listing.txt
          npm pack
          [ -f "${TARBALL}" ] || {
            echo "::error::expected ${TARBALL} was not produced";
            ls -l
            exit 1;
          }
          echo "packed: ${TARBALL}"
          tar -tzf "${TARBALL}" > listing.txt
          for required in \
            package/node_modules/@omp-deck/protocol/src/index.ts \
            package/apps/web/dist/index.html \
            package/bin/omp-deck.mjs; do
            grep -qx "${required}" listing.txt || {
              echo "::error::${required} missing from the tarball";
              exit 1;
            }
          done
          # #20 class: everything shipped from bin/ and apps/server/src must be
          # tracked by git, so a dirty working copy cannot leak into a release.
          UNTRACKED=$(comm -23 \
            <(sed -n 's|^package/||p' listing.txt | grep -v '/$' | sort -u) \
            <(git ls-files | sort -u) | grep -E '^(apps/server/src/|bin/)' || true)
          if [ -n "${UNTRACKED}" ]; then
            echo "::error::tarball contains files that are not in git:"
            echo "${UNTRACKED}"
            exit 1
          fi
          rm -f listing.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: env.DRY_RUN != 'true'
        with:
          name: npm-tarballs
          path: |
            packages/protocol/*.tgz
            omp-deck-*.tgz
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: verify
    # Real publishes need a tag ref: a tag push always qualifies, a manual run
    # only when dispatched on a tag with dry_run turned off.
    if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.dry_run == false)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-tarballs

      - name: publish @omp-deck/protocol, then omp-deck
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          WHOAMI=$(npm whoami) # fails the job early when the token is missing or invalid
          echo "publishing as ${WHOAMI}"

          publish_one() {
            local name="$1" version="$2" tarball="$3" packument decision
            if packument=$(npm view "${name}" --json 2>/tmp/npm-view.err); then
              # An existing name must be ours, otherwise the run stops here
              # instead of treating a squatted name as "already published".
              decision=$(node -e '
                const [raw, version, whoami] = process.argv.slice(1);
                const pkg = JSON.parse(raw);
                const owners = (pkg.maintainers ?? []).map((m) => (typeof m === "string" ? m : m.name));
                if (!owners.includes(whoami)) {
                  console.error(`::error::${pkg.name} is owned by ${owners.join(", ") || "(unknown)"}, not by ${whoami} — refusing to treat it as ours (see #19)`);
                  process.exit(1);
                }
                console.log(pkg.versions && Object.hasOwn(pkg.versions, version) ? "skip" : "publish");
              ' "${packument}" "${version}" "${WHOAMI}")
              if [ "${decision}" = "skip" ]; then
                echo "${name}@${version} is already published by ${WHOAMI} — nothing to do."
                return 0
              fi
              echo "${name}@${version} exists and is ours, but the version is new."
            else
              grep -q 'E404' /tmp/npm-view.err || {
                echo "::error::npm view ${name} failed for a reason other than 404:"
                cat /tmp/npm-view.err
                exit 1
              }
              echo "${name} is not on the registry yet."
            fi
            echo "publishing ${tarball}"
            npm publish "${tarball}" --access public --provenance
          }

          publish_one "@omp-deck/protocol" \
            "$(node -p "require('./packages/protocol/package.json').version")" \
            "$(ls packages/protocol/*.tgz | head -1)"
          publish_one "omp-deck" \
            "$(node -p "require('./package.json').version")" \
            "$(ls omp-deck-*.tgz | head -1)"
